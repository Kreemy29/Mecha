<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; width: 280px; padding: 14px;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #131318; color: #e8e8ee;
      }
      h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
      .dot.on { background: #10b981; }
      label { display: block; font-size: 11px; color: #9a9aa8; margin: 8px 0 4px; }
      input {
        width: 100%; box-sizing: border-box; padding: 7px 8px; border-radius: 8px;
        border: 1px solid #2c2c36; background: #1c1c24; color: inherit; font: inherit;
      }
      button {
        width: 100%; margin-top: 12px; padding: 8px; border: 0; border-radius: 8px;
        font: inherit; font-weight: 600; cursor: pointer; background: #7c7cf0; color: #fff;
      }
      button.out { background: #2c2c36; }
      button:disabled { opacity: .5; cursor: default; }
      .muted { color: #9a9aa8; font-size: 11px; }
      .err { color: #f87171; font-size: 11px; margin-top: 8px; }
      a { color: #9a9aa8; font-size: 11px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1><span id="dot" class="dot"></span> Mecha Work Tracker</h1>

    <section id="setup" hidden>
      <p class="muted">Paste the app address and your tracker key from the app's Tracker page.</p>
      <label for="appUrl">App address</label>
      <input id="appUrl" placeholder="https://your-app.onrender.com" />
      <label for="key">Tracker key</label>
      <input id="key" placeholder="mk_..." />
      <button id="connect">Connect</button>
    </section>

    <section id="main" hidden>
      <p id="who"></p>
      <p id="state" class="muted"></p>
      <button id="clock"></button>
      <p class="muted" style="margin-top:10px">
        While you're clocked in, the sites and tabs you use in this Chrome profile are shared with your managers.
      </p>
      <a href="#" id="disconnect">Disconnect</a>
    </section>

    <p id="error" class="err" hidden></p>
    <script src="popup.js"></script>
  </body>
</html>
